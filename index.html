<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Israeli Payslip Explainer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f0f2ff;
      --surface: #ffffff;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #eef2ff;
      --primary-glow: rgba(99,102,241,0.25);
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --success: #10b981;
      --success-light: #ecfdf5;
      --success-dark: #059669;
      --warning: #f59e0b;
      --warning-light: #fffbeb;
      --error: #ef4444;
      --error-light: #fef2f2;
      --radius: 18px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
      --shadow: 0 4px 16px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.04);
      --shadow-lg: 0 20px 48px rgba(99,102,241,0.18), 0 4px 12px rgba(0,0,0,0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero Header ──────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(145deg, #0d0d2b 0%, #1e1b4b 45%, #2d2469 100%);
      padding: 56px 24px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* subtle radial glow */
    .hero::before {
      content: '';
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, transparent 70%);
      pointer-events: none;
    }
    /* bottom wave */
    .hero::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 48px;
      background: var(--bg);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .hero-flags {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    .hero-flags span { font-size: 2rem; line-height: 1; }
    .hero-flag-divider {
      width: 1px; height: 24px;
      background: rgba(255,255,255,0.2);
    }
    h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }
    .hero-subtitle {
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
      position: relative;
      z-index: 1;
    }
    .hero-subtitle .hebrew {
      direction: rtl;
      unicode-bidi: embed;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
    }

    /* ── Page Body ──────────────────────────────────────────────────────── */
    .page-body {
      max-width: 620px;
      margin: -52px auto 0;
      padding: 0 16px 80px;
      position: relative;
      z-index: 2;
    }

    /* ── Cards ──────────────────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .card-inner {
      padding: 22px 22px;
    }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    /* ── Upload card ──────────────────────────────────────────────────── */
    #upload-section {
      box-shadow: var(--shadow-lg);
      border: 1.5px solid rgba(99,102,241,0.12);
    }

    .dropzone {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 44px 24px;
      border: 2px dashed var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
      min-height: 190px;
      background: #fafbff;
    }
    .dropzone:hover,
    .dropzone.drag-over {
      border-color: var(--primary);
      background: var(--primary-light);
      transform: scale(1.005);
    }
    .dropzone.has-file {
      border: none;
      border-radius: 0;
      background: var(--surface);
      padding: 16px 20px 4px;
      min-height: unset;
      cursor: default;
      transform: none;
    }
    .dropzone.loading {
      border-color: transparent;
      background: #fafbff;
      pointer-events: none;
      transform: none;
    }

    .upload-icon-wrap {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #eef2ff 0%, #e0e7ff 100%);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(99,102,241,0.15);
    }
    .upload-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }
    .upload-hint {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .upload-hint strong { color: var(--text); }

    .btn-browse {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 100px;
      background: var(--primary);
      color: white;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      box-shadow: 0 2px 8px var(--primary-glow);
    }
    .btn-browse:hover {
      background: var(--primary-dark);
      box-shadow: 0 4px 14px var(--primary-glow);
      transform: translateY(-1px);
    }

    /* ── Preview state ─────────────────────────────────────────────────── */
    .preview-wrapper { width: 100%; display: none; }
    .has-file .preview-wrapper { display: block; }
    .has-file .upload-idle { display: none; }

    #preview-canvas {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .preview-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 10px;
      gap: 8px;
    }
    .file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--success-light);
      border-radius: 100px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--success-dark);
      min-width: 0;
    }
    .file-chip-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 200px;
    }
    .btn-change {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 5px 12px;
      border-radius: 100px;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: 500;
    }
    .btn-change:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }

    #text-layer-status {
      margin: 0 20px 14px;
      padding: 10px 14px;
      border-radius: var(--radius-xs);
      font-size: 0.82rem;
      line-height: 1.5;
      display: none;
    }

    /* ── Loading ───────────────────────────────────────────────────────── */
    .loading-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 44px 24px;
    }
    .loading .upload-idle,
    .loading .preview-wrapper { display: none; }
    .loading .loading-wrapper { display: flex; }

    .spinner-ring {
      width: 44px; height: 44px;
      position: relative;
    }
    .spinner-ring::before,
    .spinner-ring::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
    }
    .spinner-ring::before {
      border: 3px solid var(--border);
    }
    .spinner-ring::after {
      border: 3px solid transparent;
      border-top-color: var(--primary);
      animation: spin 0.7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      max-width: 260px;
    }
    .loading-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      opacity: 0.7;
      margin-top: -8px;
      text-align: center;
    }

    /* ── Analyze button ─────────────────────────────────────────────────── */
    #analyze-btn-wrapper {
      display: none;
      padding: 12px 20px 20px;
      background: var(--surface);
    }
    #analyze-btn {
      display: none;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px var(--primary-glow);
      letter-spacing: -0.01em;
      position: relative;
      overflow: hidden;
    }
    #analyze-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 100%);
    }
    #analyze-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px var(--primary-glow);
    }
    #analyze-btn:active { transform: scale(0.99); }

    /* ── Error ──────────────────────────────────────────────────────────── */
    .error-banner {
      display: none;
      padding: 12px 16px;
      background: var(--error-light);
      border: 1px solid #fecaca;
      border-radius: var(--radius-xs);
      color: var(--error);
      font-size: 0.85rem;
      margin: 0 20px 16px;
      line-height: 1.5;
    }
    .error-banner.visible { display: block; }

    /* ── Results ────────────────────────────────────────────────────────── */
    #results-section { display: none; }
    #results-section.visible { display: block; }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 0 2px;
    }
    .results-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    .btn-reset {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.82rem;
      color: var(--primary);
      background: var(--primary-light);
      border: none;
      cursor: pointer;
      padding: 7px 14px;
      border-radius: 100px;
      transition: all 0.15s;
      font-weight: 600;
    }
    .btn-reset:hover { background: #dde4ff; }

    /* ── Summary card ───────────────────────────────────────────────────── */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    .summary-item {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      border: 1px solid var(--border-subtle);
    }
    .summary-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }
    .summary-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .summary-value.net {
      background: linear-gradient(135deg, var(--success), var(--success-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .summary-value.gross {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .summary-period {
      margin-top: 14px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .summary-period::before {
      content: '📅';
      font-size: 0.85rem;
    }

    /* ── Line items ─────────────────────────────────────────────────────── */
    .line-table {
      width: 100%;
      border-collapse: collapse;
    }
    .line-table tr {
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.1s;
    }
    .line-table tbody tr:last-child { border-bottom: none; }
    .line-table td {
      padding: 11px 6px;
      font-size: 0.875rem;
    }
    .line-table .col-hebrew {
      color: var(--text-muted);
      font-size: 0.75rem;
      direction: rtl;
      unicode-bidi: embed;
      width: 28%;
    }
    .line-table .col-english {
      color: var(--text);
      font-weight: 600;
    }
    .line-table .col-amount {
      text-align: right;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-size: 0.9rem;
    }
    .line-table .col-pct {
      text-align: right;
      color: var(--text-muted);
      font-size: 0.75rem;
      width: 44px;
      padding-left: 4px;
    }
    /* clickable row cursor */
    .line-table tbody tr[data-explanation] { cursor: pointer; }
    .line-table tbody tr[data-explanation]:hover { background: var(--bg); }

    /* ── Explanation rows ───────────────────────────────────────────────── */
    .explanation-row td {
      padding: 0 6px 12px;
    }
    .explanation-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.6;
      padding: 10px 14px;
      background: var(--bg);
      border-radius: var(--radius-xs);
      border-left: 3px solid var(--primary);
    }

    /* ── Notes ──────────────────────────────────────────────────────────── */
    .notes-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notes-list li {
      font-size: 0.85rem;
      color: var(--text);
      padding: 11px 14px;
      background: var(--warning-light);
      border-radius: var(--radius-xs);
      border-left: 3px solid var(--warning);
      line-height: 1.55;
    }

    /* ── Unknown tags ───────────────────────────────────────────────────── */
    .unknown-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .unknown-tag {
      font-size: 0.78rem;
      padding: 5px 12px;
      background: var(--bg);
      border-radius: 100px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      direction: rtl;
      unicode-bidi: embed;
    }

    /* ── Confidence badge ───────────────────────────────────────────────── */
    .confidence-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 100px;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .confidence-high { background: var(--success-light); color: var(--success-dark); }
    .confidence-medium { background: var(--warning-light); color: var(--warning); }
    .confidence-low { background: var(--error-light); color: var(--error); }

    /* ── Responsive / Mobile ───────────────────────────────────────────── */
    @media (max-width: 520px) {
      .hero { padding: 44px 20px 88px; }
      .page-body { padding: 0 12px 72px; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
      .summary-grid .summary-item:last-child { grid-column: span 2; }
      .line-table .col-hebrew { display: none; }
      .card-inner { padding: 18px 16px; }
      .dropzone { padding: 36px 20px; }
      #analyze-btn { font-size: 0.95rem; padding: 15px; }
      .file-chip-name { max-width: 140px; }
    }

    @media (max-width: 360px) {
      h1 { font-size: 1.6rem; }
      .summary-value { font-size: 1.1rem; }
    }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #results-section.visible {
      animation: fadeUp 0.3s ease;
    }
    #upload-section {
      animation: fadeUp 0.4s ease 0.1s both;
    }
  </style>
</head>
<body>
  <!-- Hero Header -->
  <header class="hero">
    <div class="hero-flags">
      <span>🇺🇸</span>
      <div class="hero-flag-divider"></div>
      <span>🇮🇱</span>
    </div>
    <h1>Payslip Explainer</h1>
    <p class="hero-subtitle">Understand your <span class="hebrew">תלוש משכורת</span> in plain English</p>
  </header>

  <div class="page-body">
    <!-- Upload Card -->
    <div id="upload-section" class="card">
      <label class="dropzone" id="dropzone" for="file-input">
        <!-- Idle state -->
        <div class="upload-idle">
          <div class="upload-icon-wrap">📄</div>
          <p class="upload-title">Drop your payslip here</p>
          <p class="upload-hint">PDF, JPG, or PNG &nbsp;·&nbsp; <strong>screenshot OK</strong></p>
          <span class="btn-browse">Browse file</span>
        </div>

        <!-- Preview state -->
        <div class="preview-wrapper">
          <canvas id="preview-canvas"></canvas>
        </div>

        <!-- Loading state -->
        <div class="loading-wrapper">
          <div class="spinner-ring"></div>
          <p class="loading-text" id="loading-text">Reading payslip…</p>
          <p class="loading-sub" id="loading-sub"></p>
        </div>
      </label>

      <!-- Preview meta row (outside label so buttons don't trigger file picker) -->
      <div class="preview-meta" id="preview-meta" style="display:none">
        <span class="file-chip">
          <span>✓</span>
          <span class="file-chip-name" id="file-name-text">payslip.pdf</span>
        </span>
        <button class="btn-change" id="change-btn" type="button">Change file</button>
      </div>

      <div id="text-layer-status"></div>

      <input type="file" id="file-input" accept=".pdf,image/jpeg,image/png,image/webp" style="display:none">

      <div id="analyze-btn-wrapper">
        <button id="analyze-btn" type="button">Explain This Payslip ✦</button>
      </div>

      <div id="file-error" class="error-banner"></div>
    </div>

    <!-- Results -->
    <div id="results-section">
      <div class="results-header">
        <h2>Your Payslip Explained</h2>
        <button class="btn-reset" id="reset-btn">↑ New payslip</button>
      </div>

      <div id="card-summary" class="card" style="display:none"></div>
      <div id="card-earnings" class="card" style="display:none"></div>
      <div id="card-deductions" class="card" style="display:none"></div>
      <div id="card-employer" class="card" style="display:none"></div>
      <div id="card-notes" class="card" style="display:none"></div>
      <div id="card-unknown" class="card" style="display:none"></div>
    </div>
  </div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    // ─── Israeli Payslip Dictionary ───────────────────────────────────────────
    // Maps Hebrew terms (normalized, no nikud) → { english, category, explanation }
    // Categories: earnings | deduction | employer | info
    const DICTIONARY = [
      // ── Earnings ──────────────────────────────────────────────────────────
      { patterns: ['שכר יסוד', 'שכר בסיס', 'משכורת יסוד', 'שכר'], category: 'earnings',
        english: 'Base Salary', explanation: 'Your core monthly salary before any additions or deductions.' },
      { patterns: ['מילואים', 'מלואים'], category: 'earnings',
        english: 'Reserve Military Duty (Miluim)', explanation: 'Pay for days spent in IDF reserve service (מילואים). By law, your employer must continue paying your salary during reserve duty. The state reimburses the employer, and you may see the miluim compensation appear as a separate income line. The quantity shown (e.g. 0.10) reflects the fraction of the month spent on reserve duty.' },
      { patterns: ['גלובלית', 'גלובלי', 'גלובליות', 'תוספת גלובלית', 'שינוי גלובלי'], category: 'earnings',
        english: 'Global Supplement (Tosefet Globalit)', explanation: 'A fixed lump-sum supplement added to the base salary. Israeli employers often split salary into a "base" part and a "global" part for administrative reasons (collective agreements, overtime calculations, etc.). Both parts are regular taxable salary.' },
      { patterns: ['שעות נוספות', 'שע"נ', 'שעות נוסף'], category: 'earnings',
        english: 'Overtime', explanation: 'Pay for hours worked beyond your standard working hours. In Israel, overtime is regulated by law — the first 2 hours are paid at 125% and additional hours at 150%.' },
      { patterns: ['נסיעות', 'הסעות', 'דמי נסיעה', 'החזר נסיעות'], category: 'earnings',
        english: 'Travel / Commute Allowance', explanation: 'Reimbursement for commuting costs (bus, train). Israeli law requires employers to cover transportation expenses up to a set monthly cap.' },
      { patterns: ['אש"ל', 'אוכל', 'ארוחות', 'שי לאוכל', 'קצובת אוכל'], category: 'earnings',
        english: 'Meal Allowance', explanation: 'A monthly allowance toward meals. Up to a certain amount it is tax-exempt.' },
      { patterns: ['בונוס', 'מענק', 'פרמיה', 'עמלה'], category: 'earnings',
        english: 'Bonus / Commission', explanation: 'A one-time or periodic extra payment on top of regular salary.' },
      { patterns: ['שי לחג', 'שי חג', 'מתנה'], category: 'earnings',
        english: 'Holiday Gift / Voucher', explanation: 'A gift given by the employer around holidays (Rosh Hashana, Pesach, etc.). Tax-exempt up to a government-set limit per year.' },

    // ─── Parser ───────────────────────────────────────────────────────────────
    // Normalize Hebrew text (remove nikud, extra spaces)
    function normalize(text) {
      return text
        .replace(/[\u0591-\u05C7]/g, '') // remove nikud (vowel marks)
        .replace(/\s+/g, ' ')
        .trim();
    }

    // Extract text from a PDF page
    async function extractPdfText(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        // Group items by approximate Y position to form lines
        const lines = {};
        for (const item of content.items) {
          if (!item.str) continue;
          const y = Math.round(item.transform[5] / 5) * 5; // bucket by ~5px rows
          if (!lines[y]) lines[y] = [];
          lines[y].push(item.str);
        }
        // Sort by Y descending (top to bottom) and join
        const sorted = Object.entries(lines).sort((a, b) => b[0] - a[0]);
        for (const [, tokens] of sorted) {
          fullText += tokens.join(' ') + '\n';
        }
      }
      return fullText;
    }

    // Render PDF first page to canvas for preview (scale: 1.5 for preview, 3.0 for OCR)
    async function renderPdfPreview(file, scale = 1.5) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale });
      const canvas = document.getElementById('preview-canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;
    }

    // Extract NIS amounts near a text match
    function extractAmount(line) {
      // Match patterns like: 5,320.00  or  5320  or  ₪5,320
      const match = line.match(/[₪]?\s*([\d,]+(?:\.\d{1,2})?)/);
      if (!match) return null;
      const num = parseFloat(match[1].replace(/,/g, ''));
      return isNaN(num) || num <= 0 ? null : num;
    }

    function formatNIS(amount) {
      if (amount == null) return null;
      return '₪' + amount.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    // Parse payslip text into structured data
    function parsePayslip(rawText) {
      const lines = rawText.split('\n').map(normalize).filter(Boolean);

      const results = {
        period: null,
        gross: null,
        net: null,
        earnings: [],
        deductions: [],
        employer: [],
        notes: [],
        unknown: [],
        matchedLines: new Set(),
      };

      // Detect period (month + year)
      const monthsHebrew = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
      const monthsEnglish = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      for (const line of lines) {
        for (let i = 0; i < monthsHebrew.length; i++) {
          if (line.includes(monthsHebrew[i])) {
            const yearMatch = line.match(/20\d{2}/);
            results.period = monthsEnglish[i] + (yearMatch ? ' ' + yearMatch[0] : '');
            break;
          }
        }
        // Also check numeric date patterns like 01/2025
        if (!results.period) {
          const numMatch = line.match(/(\d{1,2})[\/\-](\d{4})/);
          if (numMatch) {
            const month = parseInt(numMatch[1]);
            if (month >= 1 && month <= 12) {
              results.period = monthsEnglish[month - 1] + ' ' + numMatch[2];
            }
          }
        }
      }

      // Helper: find the first amount in line or the next N lines
      function amountOnLineOrNearby(lines, idx, lookahead = 2) {
        for (let i = idx; i <= Math.min(idx + lookahead, lines.length - 1); i++) {
          const a = extractAmount(lines[i]);
          if (a) return a;
        }
        return null;
      }

      // Match each line against dictionary
      for (let li = 0; li < lines.length; li++) {
        const line = lines[li];
        const norm = normalize(line);
        const amount = extractAmount(line);

        // Check gross / net
        if (/שכר ברוטו|ברוטו/.test(norm)) {
          const val = amount || amountOnLineOrNearby(lines, li + 1);
          if (val) { results.gross = val; results.matchedLines.add(norm); continue; }
        }
        if (/שכר נטו|לתשלום|נטו/.test(norm)) {
          const val = amount || amountOnLineOrNearby(lines, li + 1);
          if (val) { results.net = val; results.matchedLines.add(norm); continue; }
        }

        let matched = false;
        for (const entry of DICTIONARY) {
          if (entry.category === 'info') continue; // handled separately
          for (const pattern of entry.patterns) {
            if (norm.includes(pattern)) {
              matched = true;
              const record = { hebrew: extractHebrewLabel(line), english: entry.english, explanation: entry.explanation, amount };
              if (entry.category === 'earnings') results.earnings.push(record);
              else if (entry.category === 'deduction') results.deductions.push(record);
              else if (entry.category === 'employer') results.employer.push(record);
              results.matchedLines.add(norm);
              break;
            }
          }
          if (matched) break;
        }

        // Collect unmatched Hebrew lines with amounts (likely unlabeled items)
        if (!matched && amount && /[\u05D0-\u05EA]/.test(line)) {
          const hebrewLabel = extractHebrewLabel(line);
          if (hebrewLabel.length > 1) {
            results.unknown.push({ hebrew: hebrewLabel, amount });
          }
        }
      }

      // Deduplicate (same english term appearing multiple times — take first)
      results.earnings = dedupe(results.earnings);
      results.deductions = dedupe(results.deductions);
      results.employer = dedupe(results.employer);

      // Generate notes
      if (results.gross && results.net) {
        const deductionTotal = results.gross - results.net;
        const deductionPct = ((deductionTotal / results.gross) * 100).toFixed(0);
        results.notes.push(`Total deductions are ₪${deductionTotal.toLocaleString()} (${deductionPct}% of gross salary).`);
      }

      const khBtn = results.deductions.find(d => d.english.includes('Training Fund'));
      if (khBtn) {
        results.notes.push('💡 Keren Hishtalmut is one of Israel\'s best financial benefits. After 6 years, you can withdraw the balance completely tax-free for any purpose.');
      }

      const pension = results.deductions.find(d => d.english.includes('Pension'));
      const employerPension = results.employer.find(d => d.english.includes('Pension'));
      if (pension && employerPension && pension.amount && employerPension.amount) {
        results.notes.push(`💡 In addition to your ₪${pension.amount.toLocaleString()} pension contribution, your employer adds ₪${employerPension.amount.toLocaleString()} — this extra amount goes directly to your retirement.`);
      }

      if (results.unknown.length > 0) {
        results.notes.push(`⚠️ Some items on your payslip weren't automatically recognized (shown below). They may be company-specific allowances or deductions.`);
      }

      return results;
    }

    function extractHebrewLabel(line) {
      // Extract the Hebrew word(s) from the line
      const match = line.match(/[\u05D0-\u05EA"'\s]+/g);
      if (!match) return line.substring(0, 30);
      return match.join('').replace(/\s+/g, ' ').trim().substring(0, 40);
    }

    function dedupe(items) {
      const seen = new Set();
      return items.filter(item => {
        if (seen.has(item.english)) return false;
        seen.add(item.english);
        return true;
      });
    }

    // ─── Rendering ────────────────────────────────────────────────────────────
    function showCard(id, html) {
      const el = document.getElementById(id);
      el.innerHTML = html;
      el.style.display = 'block';
    }

    function renderLineTable(items, showExplanations = false) {
      if (!items.length) return '<p style="color:var(--text-muted);font-size:.875rem;">No items found</p>';
      let html = '<table class="line-table">';
      for (const item of items) {
        const amtStr = item.amount ? formatNIS(item.amount) : '—';
        html += `<tr>
          <td class="col-hebrew">${item.hebrew || ''}</td>
          <td class="col-english">${item.english}</td>
          <td class="col-amount">${amtStr}</td>
        </tr>`;
        if (showExplanations && item.explanation) {
          html += `<tr class="explanation-row"><td colspan="3">
            <div class="explanation-text">${item.explanation}</div>
          </td></tr>`;
        }
      }
      html += '</table>';
      return html;
    }

    function renderResults(data) {
      // Summary card
      const gross = data.gross ? formatNIS(data.gross) : '—';
      const net = data.net ? formatNIS(data.net) : '—';
      const deducted = (data.gross && data.net) ? formatNIS(data.gross - data.net) : '—';
      const periodStr = data.period ? `<p class="summary-period">Pay period: <strong>${data.period}</strong></p>` : '';

      showCard('card-summary', `<div class="card-inner">
        <p class="card-title">Summary</p>
        <div class="summary-grid">
          <div class="summary-item">
            <div class="summary-label">Gross Pay</div>
            <div class="summary-value gross">${gross}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Deductions</div>
            <div class="summary-value">${deducted}</div>
          </div>
          <div class="summary-item">
            <div class="summary-label">Take-Home</div>
            <div class="summary-value net">${net}</div>
          </div>
        </div>
        ${periodStr}
      </div>`);

      // Earnings
      if (data.earnings.length) {
        showCard('card-earnings', `<div class="card-inner">
          <p class="card-title">Your Earnings</p>
          ${renderLineTable(data.earnings, false)}
        </div>`);
      }

      // Deductions (with explanations)
      if (data.deductions.length) {
        showCard('card-deductions', `<div class="card-inner">
          <p class="card-title">Deductions from Your Pay</p>
          ${renderLineTable(data.deductions, true)}
        </div>`);
      }

      // Employer contributions
      if (data.employer.length) {
        showCard('card-employer', `<div class="card-inner">
          <p class="card-title">Employer Contributions</p>
          ${renderLineTable(data.employer, true)}
        </div>`);
      }

      // Notes
      if (data.notes.length) {
        const items = data.notes.map(n => `<li>${n}</li>`).join('');
        showCard('card-notes', `<div class="card-inner">
          <p class="card-title">Notes</p>
          <ul class="notes-list">${items}</ul>
        </div>`);
      }

      // Unknown items
      if (data.unknown.length) {
        const tags = data.unknown.map(u => `<span class="unknown-tag">${u.hebrew} ${u.amount ? formatNIS(u.amount) : ''}</span>`).join('');
        showCard('card-unknown', `<div class="card-inner">
          <p class="card-title">Unrecognized Items</p>
          <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:12px;">These items appear on your payslip but weren't recognized — they may be company-specific. Ask your HR team to clarify.</p>
          <div class="unknown-list">${tags}</div>
        </div>`);
      }

      document.getElementById('results-section').classList.add('visible');
      document.getElementById('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // ─── OCR (Tesseract.js) ───────────────────────────────────────────────────
    // Lazy-load Tesseract only when OCR is actually needed
    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = () => resolve(window.Tesseract);
        s.onerror = () => reject(new Error('Could not load OCR library. Check your internet connection.'));
        document.head.appendChild(s);
      });
    }

    async function ocrCanvas(canvas) {
      loadingText.textContent = 'Loading OCR engine…';
      loadingSub.textContent = 'This runs entirely on your device — no data is sent anywhere.';
      const Tesseract = await loadTesseract();
      const worker = await Tesseract.createWorker(['heb', 'eng'], 1, {
        workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/worker.min.js',
        langPath: 'https://tessdata.projectnaptha.com/4.0.0',
        corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5/tesseract-core-simd-lstm.wasm.js',
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.round(m.progress * 100);
            loadingText.textContent = `Reading text… ${pct}%`;
            loadingSub.textContent = pct < 50 ? 'Scanning lines…' : 'Almost there…';
          } else if (m.status) {
            const friendly = {
              'loading tesseract core': 'Loading OCR engine…',
              'initializing tesseract': 'Initializing OCR…',
              'loading language traineddata': 'Downloading Hebrew language data…',
              'initializing api': 'Starting OCR…',
            };
            loadingText.textContent = friendly[m.status] || m.status;
          }
        }
      });
      const { data: { text } } = await worker.recognize(canvas);
      await worker.terminate();
      return text;
    }

    // ─── App State ────────────────────────────────────────────────────────────
    let currentFile = null;

    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    const analyzeBtnWrapper = document.getElementById('analyze-btn-wrapper');
    const fileNameText = document.getElementById('file-name-text');
    const loadingText = document.getElementById('loading-text');
    const loadingSub = document.getElementById('loading-sub');
    const fileError = document.getElementById('file-error');
    const resetBtn = document.getElementById('reset-btn');
    const changeBtn = document.getElementById('change-btn');
    const previewMeta = document.getElementById('preview-meta');

    function showError(msg) {
      fileError.textContent = msg;
      fileError.classList.add('visible');
    }
    function clearError() {
      fileError.classList.remove('visible');
    }

    function setDropzoneState(state) {
      dropzone.classList.remove('has-file', 'loading', 'drag-over');
      if (state) dropzone.classList.add(state);
      previewMeta.style.display = (state === 'has-file') ? 'flex' : 'none';
    }

    async function handleFile(file) {
      clearError();

      // Validate
      const validTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];
      if (!validTypes.includes(file.type)) {
        showError('Please upload a PDF or image file (JPG, PNG).');
        return;
      }
      if (file.size > 30 * 1024 * 1024) {
        showError('File is too large (max 30 MB).');
        return;
      }

      currentFile = file;
      fileNameText.textContent = file.name;

      // Show preview
      setDropzoneState('loading');
      loadingText.textContent = 'Loading preview…';

      try {
        if (file.type === 'application/pdf') {
          await renderPdfPreview(file);
          // Probe for text layer
          loadingText.textContent = 'Checking for text layer…';
          const probeText = await extractPdfText(file);
          const hasText = probeText && probeText.trim().length >= 20;
          const statusEl = document.getElementById('text-layer-status');
          statusEl.style.cssText = 'display:block;padding:9px 20px 14px;font-size:0.82rem;line-height:1.5;';
          if (hasText) {
            statusEl.innerHTML = '<span style="display:inline-block;padding:6px 12px;border-radius:8px;background:#ecfdf5;border:1px solid #a7f3d0;color:#059669;">✓ <strong>Digital PDF</strong> — will analyze instantly.</span>';
          } else {
            statusEl.innerHTML = '<span style="display:inline-block;padding:6px 12px;border-radius:8px;background:#eef2ff;border:1px solid #c7d2fe;color:#4f46e5;">🔍 <strong>Image PDF</strong> — OCR will read the text (~20–30 s).</span>';
          }
        } else {
          // Image: draw to canvas at high resolution for OCR
          const img = new Image();
          const url = URL.createObjectURL(file);
          await new Promise((resolve, reject) => {
            img.onload = resolve;
            img.onerror = reject;
            img.src = url;
          });
          const canvas = document.getElementById('preview-canvas');
          // Keep full resolution for OCR accuracy (just cap at 2400px wide)
          const maxW = 2400;
          const scale = Math.min(1, maxW / img.naturalWidth);
          canvas.width = img.naturalWidth * scale;
          canvas.height = img.naturalHeight * scale;
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          const statusEl = document.getElementById('text-layer-status');
          statusEl.style.cssText = 'display:block;padding:9px 20px 14px;font-size:0.82rem;line-height:1.5;';
          statusEl.innerHTML = '<span style="display:inline-block;padding:6px 12px;border-radius:8px;background:#eef2ff;border:1px solid #c7d2fe;color:#4f46e5;">🔍 <strong>Image uploaded</strong> — OCR will read the Hebrew text (~20–30 s).</span>';
        }
        setDropzoneState('has-file');
        analyzeBtnWrapper.style.display = 'block';
        analyzeBtn.style.display = 'block';
      } catch (e) {
        showError('Could not preview the file. Please make sure it\'s a valid PDF or image.');
        setDropzoneState(null);
        currentFile = null;
      }
    }

    async function analyzePayslip() {
      if (!currentFile) return;
      clearError();

      setDropzoneState('loading');
      analyzeBtnWrapper.style.display = 'none';
      loadingText.textContent = 'Reading payslip text…';
      loadingSub.textContent = '';

      // Hide previous results
      document.getElementById('results-section').classList.remove('visible');
      ['card-summary','card-earnings','card-deductions','card-employer','card-notes','card-unknown']
        .forEach(id => { document.getElementById(id).style.display = 'none'; });

      try {
        let text = '';
        if (currentFile.type === 'application/pdf') {
          text = await extractPdfText(currentFile);
        }

        // If no text layer (image PDF or uploaded image), run OCR
        if (!text || text.trim().length < 20) {
          const canvas = document.getElementById('preview-canvas');
          // For image PDFs, re-render at higher scale for better OCR accuracy
          if (currentFile.type === 'application/pdf') {
            loadingText.textContent = 'Rendering page for OCR…';
            await renderPdfPreview(currentFile, 3.0); // high-res render
          }
          text = await ocrCanvas(canvas);
        }

        loadingText.textContent = 'Analyzing…';
        const data = parsePayslip(text);

        setDropzoneState('has-file');
        analyzeBtnWrapper.style.display = 'block';
        analyzeBtn.style.display = 'block';
        analyzeBtn.textContent = 'Re-analyze ✦';

        if (!data.gross && !data.net && !data.earnings.length && !data.deductions.length) {
          showError('The payslip was read but no recognizable items were found. The format may be unusual — try a different file or contact support.');
          return;
        }

        renderResults(data);
      } catch (e) {
        showError('An error occurred while reading the file: ' + (e?.message || String(e) || 'Unknown error'));
        setDropzoneState('has-file');
        analyzeBtnWrapper.style.display = 'block';
        analyzeBtn.style.display = 'block';
      }
    }

    function resetApp() {
      currentFile = null;
      fileInput.value = '';
      setDropzoneState(null);
      analyzeBtnWrapper.style.display = 'none';
      analyzeBtn.style.display = 'none';
      analyzeBtn.textContent = 'Explain This Payslip ✦';
      document.getElementById('text-layer-status').style.display = 'none';
      clearError();
      document.getElementById('results-section').classList.remove('visible');
      ['card-summary','card-earnings','card-deductions','card-employer','card-notes','card-unknown']
        .forEach(id => { document.getElementById(id).style.display = 'none'; });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─── Event Listeners ──────────────────────────────────────────────────────
    fileInput.addEventListener('change', e => {
      if (e.target.files[0]) handleFile(e.target.files[0]);
    });

    // Drag and drop
    ['dragenter','dragover'].forEach(evt => {
      dropzone.addEventListener(evt, e => {
        e.preventDefault();
        if (!dropzone.classList.contains('has-file') && !dropzone.classList.contains('loading')) {
          dropzone.classList.add('drag-over');
        }
      });
    });
    dropzone.addEventListener('dragleave', e => {
      if (!dropzone.contains(e.relatedTarget)) {
        dropzone.classList.remove('drag-over');
      }
    });
    dropzone.addEventListener('drop', e => {
      e.preventDefault();
      dropzone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // Prevent the label click from opening file picker when already has file
    dropzone.addEventListener('click', e => {
      if (dropzone.classList.contains('has-file') || dropzone.classList.contains('loading')) {
        e.preventDefault();
      }
    });

    changeBtn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      resetApp();
      // Programmatically open file picker
      fileInput.click();
    });

    analyzeBtn.addEventListener('click', analyzePayslip);
    resetBtn.addEventListener('click', resetApp);
  </script>
</body>
</html>
